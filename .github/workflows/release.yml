name: Publish Windows installer
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify tag matches the application
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag and version differ" }
      - run: npm ci
      - run: node node_modules/electron/install.js
      - run: npm test
      - run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Test the packaged application
        run: node node_modules/playwright/cli.js test tests/code-fences.spec.js tests/system-integration.spec.js tests/native-context.spec.js -g "code|Code|context Insert|Branding|About|unfinished|native-context"
        env:
          INKSTONE_EXECUTABLE: release/win-unpacked/Inkstone.exe
      - name: Verify installer and source identity
        run: |
          node scripts/verify-windows-package.mjs
          node scripts/verify-release-source.mjs release/win-unpacked/resources/app.asar
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/Inkstone-*-windows-x64.exe
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: installer
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - name: Publish the verified installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" "release/Inkstone-${version}-windows-x64.exe" --verify-tag --title "Inkstone ${version}" --notes-file "docs/releases/${GITHUB_REF_NAME}.md" --latest
