<div id="inkstone-web-direction" aria-label="墨石官网风格示意">
  <style>
    #inkstone-web-direction { --is-paper: light-dark(#f4f0e6,#1c1a21); --is-ink: light-dark(#1c1a21,#f4f0e6); --is-stone: light-dark(#625d68,#b7b1bd); --is-line: light-dark(#d6d0c5,#403b45); --is-panel: light-dark(#fcfcfa,#202124); --is-red: light-dark(#c8402b,#ed8976); --is-pad: 44px; color:var(--is-ink); font-family:'Segoe UI','Microsoft YaHei',sans-serif; }
    #inkstone-web-direction * { box-sizing:border-box; }
    #inkstone-web-direction .is-page { background:var(--is-paper); padding:0 var(--is-pad) 26px; }
    #inkstone-web-direction .is-nav { display:flex; align-items:center; justify-content:space-between; gap:20px; padding:26px 0; border-bottom:1px solid var(--is-line); }
    #inkstone-web-direction .is-logo { width:174px; height:auto; display:block; }
    #inkstone-web-direction .is-logo-dark { display:none; }
    @media (prefers-color-scheme:dark) { #inkstone-web-direction .is-logo-light { display:none; } #inkstone-web-direction .is-logo-dark { display:block; } }
    #inkstone-web-direction .is-navlinks { display:flex; flex-wrap:wrap; gap:20px; font-size:12px; }
    #inkstone-web-direction a { color:inherit; text-decoration:none; }
    #inkstone-web-direction a:hover { text-decoration:underline; text-underline-offset:5px; }
    #inkstone-web-direction .is-hero { text-align:center; padding:56px 0 38px; }
    #inkstone-web-direction .is-kicker { font-size:12px; color:var(--is-stone); margin:0 0 18px; }
    #inkstone-web-direction h1 { font-family:'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif; font-weight:500; font-size:clamp(28px,5.3vw,43px); line-height:1.45; margin:0; letter-spacing:0.035em; }
    #inkstone-web-direction .is-description { font-size:14px; line-height:1.9; margin:18px auto 25px; max-width:430px; color:var(--is-stone); }
    #inkstone-web-direction .is-cta { display:inline-flex; align-items:center; gap:18px; background:var(--is-ink); color:var(--is-paper); border:1px solid var(--is-ink); border-radius:3px; padding:12px 19px; font-size:13px; }
    #inkstone-web-direction .is-meta { margin:16px 0 0; color:var(--is-stone); font-size:11px; }
    #inkstone-web-direction .is-figure { margin:0; }
    #inkstone-web-direction .is-caption { display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px; color:var(--is-stone); font-size:11px; padding:10px 0; }
    #inkstone-web-direction .is-caption span:first-child { color:var(--is-red); }
    #inkstone-web-direction .is-shot { width:100%; height:auto; display:block; border:1px solid var(--is-line); background:var(--is-panel); }
    #inkstone-web-direction .is-shot-dark { display:none; }
    @media (prefers-color-scheme:dark) { #inkstone-web-direction .is-shot-light { display:none; } #inkstone-web-direction .is-shot-dark { display:block; } }
    #inkstone-web-direction .is-features { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:22px; padding-top:26px; }
    #inkstone-web-direction .is-feature { border-top:1px solid var(--is-line); padding-top:13px; }
    #inkstone-web-direction h2 { font-family:'Noto Serif SC','SimSun',serif; font-size:17px; font-weight:500; line-height:1.5; margin:0 0 8px; }
    #inkstone-web-direction .is-feature p { margin:0; color:var(--is-stone); font-size:12px; line-height:1.85; }
    #inkstone-web-direction .is-footer { display:flex; justify-content:space-between; flex-wrap:wrap; gap:12px; padding-top:30px; font-size:11px; color:var(--is-stone); }
    @media (max-width:520px) { #inkstone-web-direction .is-page { padding:0 22px 22px; } #inkstone-web-direction .is-nav { gap:12px; padding:22px 0; } #inkstone-web-direction .is-logo { width:137px; } #inkstone-web-direction .is-navlinks { gap:12px; } #inkstone-web-direction .is-hero { padding:42px 0 29px; } #inkstone-web-direction .is-features { grid-template-columns:1fr; gap:20px; } }
    @media (pointer:coarse) { #inkstone-web-direction .is-navlinks a { display:inline-flex; min-height:44px; align-items:center; } }
  </style>

  <script>
    (() => {
      const root = document.getElementById('inkstone-web-direction');
      const hero = root.querySelector('.is-hero');
      const heading = root.querySelector('h1');
      const options = { spacing:56, type:'宋体' };
      function render() {
        hero.style.paddingTop = options.spacing + 'px';
        heading.style.fontFamily = options.type === '宋体' ? "'Noto Serif SC','Source Han Serif SC','Songti SC','SimSun',serif" : "'Segoe UI','Microsoft YaHei',sans-serif";
      }
      render();
      if (globalThis.Tweak) {
        const tweak = new Tweak({container:hero,onChange:render});
        tweak.addSlider(options,'spacing',{label:'标题上方留白',min:28,max:80,step:4,unit:'px'});
        tweak.addSelect(options,'type',{label:'标题字体',options:['宋体','黑体']});
      }
    })();
  </script>
